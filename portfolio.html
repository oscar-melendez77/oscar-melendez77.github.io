  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:   #dcecea;
      --paper-2: #cbe2df;
      --card:    #e8f3f1;
      --ink:     #0b1f1e;
      --ink-2:   #3c5a58;
      --accent:  #0f6f6a;   /* a shade deeper than before */
      --mark:    #a8532b;   /* clay, used only for status */
      --blue:    #1c5fd0;

      --rule:      rgba(11,31,30,.15);
      --rule-mid:  rgba(11,31,30,.30);
      --rule-firm: rgba(11,31,30,.50);

      --sans: 'Libre Franklin', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    ::selection { background: var(--accent); color: var(--paper); }

    body {
      background: var(--paper); color: var(--ink);
      font-family: var(--sans); font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; }
    img { display: block; max-width: 100%; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .grid { width: min(1140px, 90vw); margin-inline: auto; }
    .row  { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 32px; }
    section[id] { scroll-margin-top: 4.5rem; }

    /* the only micro-label left, and it is not monospaced */
    .k {
      font-size: .6875rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--ink-2);
    }

    /* ── top bar ─────────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--paper); border-bottom: 1px solid var(--rule-firm);
    }
    .topbar-in {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1.25rem; padding: .85rem 0; flex-wrap: wrap;
    }
    .topbar-id { font-size: .8125rem; font-weight: 600; letter-spacing: -.01em; }
    .topbar-id .role { color: var(--ink-2); font-weight: 400; }
    .topbar-id .sep  { color: var(--rule-firm); margin: 0 .5rem; }
    .topbar-nav { display: flex; gap: 1.5rem; }
    .topbar-nav a {
      font-size: .8125rem; color: var(--ink-2); text-decoration: none;
      padding-bottom: 2px; border-bottom: 1px solid transparent;
    }
    .topbar-nav a:hover { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── masthead ────────────────────────────────────────── */
    .masthead { padding-top: 6rem; }
    .masthead-main  { grid-column: 1 / span 8; }
    .masthead-aside { grid-column: 10 / span 3; align-self: end; }

    h1 {
      font-size: clamp(2.4rem, 5.4vw, 4.2rem); font-weight: 700;
      letter-spacing: -.032em; line-height: 1.04;
    }
    .lede {
      font-size: clamp(1.05rem, 1.75vw, 1.35rem); font-weight: 400; line-height: 1.38;
      letter-spacing: -.012em; margin-top: 1.4rem; max-width: 31ch;
    }
    .masthead-role { font-size: .9375rem; color: var(--ink-2); margin-top: 1.15rem; max-width: 50ch; }
    .portrait, .portrait-ph {
      width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: center 22%;
      border: 1px solid var(--rule-firm);
    }
    .portrait-ph {
      display: flex; align-items: center; justify-content: center;
      background: var(--card); font-size: 1.9rem; font-weight: 700; color: var(--ink-2);
    }

    .specbar {
      margin-top: 4rem;
      border-top: 1px solid var(--rule-firm); border-bottom: 1px solid var(--rule-firm);
      display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .specbar > div { padding: 1rem 1.5rem 1.05rem; border-left: 1px solid var(--rule); }
    .specbar > div:first-child { padding-left: 0; border-left: 0; }
    .specbar .v { font-size: .875rem; margin-top: .4rem; overflow-wrap: anywhere; }
    .specbar a { text-decoration: none; border-bottom: 1px solid var(--rule-mid); }
    .specbar a:hover { color: var(--accent); border-color: var(--accent); }
    .open-dot { color: var(--mark); }

    /* ── bands ───────────────────────────────────────────── */
    .band { padding: 4.75rem 0; border-bottom: 1px solid var(--rule); }
    .band:last-of-type { border-bottom: 0; }
    .band-label { grid-column: 1 / span 3; position: sticky; top: 4.4rem; align-self: start; }
    .band-title { font-size: .9375rem; font-weight: 600; letter-spacing: -.012em; }
    /* the spine: a hairline running the height of every section */
    .band-body {
      grid-column: 4 / -1; border-left: 1px solid var(--rule); padding-left: 32px;
    }

    .prose { font-size: 1.0625rem; line-height: 1.62; max-width: 60ch; }

    /* ── definition rows ─────────────────────────────────── */
    .deflist { border-top: 1px solid var(--rule-firm); }
    .def {
      display: grid; grid-template-columns: 12rem 1fr; gap: 1.5rem;
      padding: .8rem 0; border-bottom: 1px solid var(--rule);
    }
    .def-v { font-size: .9375rem; }
    .def-v .muted { color: var(--ink-2); }
    .deflist--tight .def { grid-template-columns: 6.5rem 1fr; gap: 1rem; }

    /* ── links ───────────────────────────────────────────── */
    .link {
      font-size: .8125rem; text-decoration: none; color: var(--ink);
      border-bottom: 1px solid var(--rule-firm); padding-bottom: 1px;
      transition: color .15s ease, border-color .15s ease;
    }
    .link:hover { color: var(--accent); border-color: var(--accent); }
    .link.is-off { color: var(--ink-2); border-bottom-style: dotted; cursor: default; }
    button.link {
      background: none; border: 0; border-bottom: 1px solid var(--rule-firm);
      font-family: inherit; font-size: .8125rem; cursor: pointer;
    }

    /* ── work ────────────────────────────────────────────── */
    .work { padding: 2.25rem 0; border-top: 1px solid var(--rule-firm); }
    .work:first-child { border-top: 0; padding-top: 0; }
    .work-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1.25rem; }
    .work-name { font-size: 1.375rem; font-weight: 700; letter-spacing: -.022em; line-height: 1.2; }
    .work-status {
      font-size: .75rem; color: var(--ink-2); white-space: nowrap;
      display: inline-flex; align-items: center; gap: .45rem;
    }
    .work-status::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      border: 1px solid var(--ink-2);
    }
    .work-status.is-live { color: var(--mark); }
    .work-status.is-live::before { background: var(--mark); border-color: var(--mark); }
    .work-desc { font-size: .9375rem; color: var(--ink-2); margin-top: .85rem; max-width: 66ch; }
    /* highlights read as rows, so they need no bullet character at all */
    .work-hl { list-style: none; margin-top: 1.3rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0 2.5rem; }
    .work-hl li {
      font-size: .8125rem; line-height: 1.5; color: var(--ink-2);
      padding: .5rem 0; border-top: 1px solid var(--rule);
    }
    .work-stack { font-size: .75rem; color: var(--ink-2); margin-top: 1.2rem; line-height: 1.7; }
    .work-links { margin-top: 1.3rem; display: flex; flex-wrap: wrap; gap: 1.5rem; }

    /* ── music ───────────────────────────────────────────── */
    .music { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); gap: 2.5rem; }
    .tube-frame { position: relative; aspect-ratio: 16 / 9; border: 1px solid var(--rule-firm); background: var(--ink); }
    .tube-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .tube-note { font-size: .75rem; line-height: 1.55; color: var(--ink-2); margin-top: .9rem; max-width: 60ch; }
    .tube-note a { text-decoration: none; border-bottom: 1px solid var(--rule-mid); color: var(--ink); }
    .tube-note a:hover { color: var(--accent); border-color: var(--accent); }
    .music-blurb { font-size: .875rem; line-height: 1.6; color: var(--ink-2); margin-bottom: 1.5rem; }
    .music-links { margin-top: 1.2rem; }

    /* ── contact / footer ────────────────────────────────── */
    .contact-mail {
      display: inline-block; font-size: clamp(1.3rem, 3.4vw, 2.2rem); font-weight: 700;
      letter-spacing: -.03em; text-decoration: none;
      border-bottom: 1px solid var(--accent); overflow-wrap: anywhere;
    }
    .contact-mail:hover { color: var(--accent); }
    .contact-links { margin-top: 1.8rem; display: flex; gap: 1.75rem; flex-wrap: wrap; }

    .foot { border-top: 1px solid var(--rule-firm); padding: 1.7rem 0 2.4rem; }
    .foot-in {
      display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      font-size: .75rem; color: var(--ink-2);
    }

    /* ── whatsapp gate ───────────────────────────────────── */
    .wa-modal {
      position: fixed; inset: 0; z-index: 999; display: none;
      align-items: center; justify-content: center;
      background: rgba(11,31,30,.5); padding: 1.2rem;
    }
    .wa-modal.open { display: flex; }
    .wa-box { background: var(--card); border: 1px solid var(--rule-firm); max-width: 380px; width: 100%; padding: 1.6rem; }
    .wa-box h3 { font-size: .9375rem; font-weight: 600; }
    .wa-box p { font-size: .8125rem; color: var(--ink-2); margin: .5rem 0 1.1rem; }
    .wa-box input {
      width: 100%; font-family: inherit; font-size: .875rem; padding: .6rem .7rem;
      border: 1px solid var(--rule-firm); background: var(--paper); color: var(--ink);
    }
    .wa-box input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
    .wa-err { color: #b3261e; font-size: .75rem; min-height: 1.15rem; margin: .6rem 0; }
    .wa-actions { display: flex; gap: 1.5rem; }

    /* ── responsive ──────────────────────────────────────── */
    @media (max-width: 900px) {
      .row { grid-template-columns: 1fr; }
      .masthead-main, .band-label, .band-body { grid-column: 1 / -1; }
      .masthead-aside { display: none; }
      .band-label { position: static; margin-bottom: 1.5rem; }
      .band-body { border-left: 0; padding-left: 0; }
      .work-hl { grid-template-columns: 1fr; }
      .music { grid-template-columns: 1fr; gap: 2rem; }
    }
    @media (max-width: 760px) {
      .specbar { grid-template-columns: 1fr 1fr; }
      .specbar > div { border-left: 1px solid var(--rule); }
      .specbar > div:nth-child(odd) { padding-left: 0; border-left: 0; }
      .specbar > div:nth-child(n+3) { border-top: 1px solid var(--rule); }
    }
    @media (max-width: 620px) {
      .masthead { padding-top: 3.5rem; }
      .band { padding: 3.25rem 0; }
      .def, .deflist--tight .def { grid-template-columns: 1fr; gap: .3rem; }
      .topbar-nav { gap: 1rem; }
      .topbar-nav a { font-size: .75rem; }
      .work-head { flex-direction: column; align-items: flex-start; gap: .4rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>

    <div class="grid row">
      <div class="band-label"><div class="band-title">Selected work</div></div>
      <div class="band-body" id="work-list"></div>
    </div>
  </section>

  <section class="band" id="music">
    <div class="grid row">
      <div class="band-label"><div class="band-title" id="music-title"></div></div>
      <div class="band-body">
        <div class="music">
          <div>
            <div class="tube-frame">
              <iframe id="tube" title="" loading="lazy" allowfullscreen
                      referrerpolicy="strict-origin-when-cross-origin"
                      allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
            </div>
            <p class="tube-note">
              A few of these covers will only play on YouTube itself.
              <a id="tube-note-link" href="#" target="_blank" rel="noopener">The rest of the channel is here</a>.
            </p>
          </div>
          <div>
            <p class="music-blurb" id="music-blurb"></p>
            <div class="deflist deflist--tight" id="music-meta"></div>
            <p class="music-links">
              <a class="link" id="yt-btn" href="#" target="_blank" rel="noopener">Open the channel</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="band" id="contact">
    <div class="grid row">
      <div class="band-label"><div class="band-title">Contact</div></div>
      <div class="band-body">
        <a class="contact-mail" id="contact-mail" href="#"></a>
        <div class="contact-links">
          <a class="link" id="c-github" href="#" target="_blank" rel="noopener">GitHub</a>
          <a class="link" id="c-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="grid foot-in">
    <span id="foot-name"></span>
    <span>Guatemala, <span id="foot-year"></span></span>
    <span>Auto-deployed on push</span>
  </div>
</footer>

<div class="wa-modal" id="wa-modal" role="dialog" aria-modal="true" aria-labelledby="wa-title">
  <div class="wa-box">
    <h3 id="wa-title">Protected link</h3>
    <p>Enter the password to open the CHAN-C WhatsApp chat.</p>
    <input id="wa-input" type="password" placeholder="Password" autocomplete="off" />
    <div class="wa-err" id="wa-err"></div>
    <div class="wa-actions">
      <button type="button" class="link" id="wa-submit">Unlock</button>
      <button type="button" class="link" id="wa-cancel">Cancel</button>
    </div>
  </div>
</div>

<script>
  /* ── Render everything from the PROFILE config ── */
  const $ = id => document.getElementById(id);

  /* one row: small label on the left, content on the right */
  const def  = (k, v) => `<div class="def"><div class="k">${k}</div><div class="def-v">${v}</div></div>`;
  /* plain comma list. Commas wrap on their own and read like writing. */
  const list = arr => arr.join(", ");
  const ext  = (href, text) => `<a class="link" href="${href}" target="_blank" rel="noopener">${text}</a>`;

  /* "End-to-End Data Specialist with experience across..." -> the job title alone */
  const shortRole = PROFILE.title.split(/\s+with\s+/i)[0].replace(/[.,]\s*$/, "");
  const initials  = PROFILE.name.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0,2).join("").toUpperCase();

  $("nav-name").textContent     = PROFILE.name;
  $("nav-role").textContent     = shortRole;
  $("hero-name").textContent    = PROFILE.name;
  $("hero-tagline").textContent = PROFILE.tagline;
  $("hero-role").textContent    = PROFILE.title;
  $("portrait-ph").textContent  = initials;
  document.title = PROFILE.name + ", " + shortRole;

  $("specbar").innerHTML = `
    <div><div class="k">Based in</div><div class="v">${PROFILE.location}</div></div>
    <div><div class="k">Status</div><div class="v"><span class="open-dot">&bull;</span> Available for work</div></div>
    <div><div class="k">Email</div><div class="v"><a href="mailto:${PROFILE.email}">${PROFILE.email}</a></div></div>
    <div><div class="k">Elsewhere</div><div class="v">
      <a href="${PROFILE.github}" target="_blank" rel="noopener">GitHub</a>,
      <a href="${PROFILE.linkedin}" target="_blank" rel="noopener">LinkedIn</a>
    </div></div>`;

  $("about-text").textContent = PROFILE.about;
  $("about-facts").innerHTML =
    def("Languages", PROFILE.languages
          .map(l => `${l.name} <span class="muted">(${l.level})</span>`).join(", ")) +
    def("Off the clock", list(PROFILE.hobbies.map(h => h.label)));

  $("skills-list").innerHTML = Object.entries(PROFILE.skills)
    .map(([group, tags]) => def(group, list(tags))).join("");

  $("work-list").innerHTML = PROFILE.projects.map(p => {
    const isLive = p.badge === "Live" || p.badge === "In Production";
    const live   = p.link && p.link !== "#";
    const links  = [];
    links.push(live ? ext(p.link, p.label) : `<span class="link is-off">${p.label}</span>`);
    if (p.waEnc) links.push(
      `<button type="button" class="link wa-locked" data-salt="${p.waEnc.salt}" data-iv="${p.waEnc.iv}"
        data-ct="${p.waEnc.ct}">Chat on WhatsApp</button>`);
    if (p.repo)     links.push(ext(p.repo, "View Repository"));
    if (p.archLink) links.push(ext(p.archLink, "Architecture"));

    return `
      <article class="work">
        <div class="work-head">
          <h3 class="work-name">${p.name}</h3>
          <span class="work-status${isLive ? " is-live" : ""}">${p.badge}</span>
        </div>
        <p class="work-desc">${p.description}</p>
        <ul class="work-hl">${p.highlights.map(h => `<li>${h}</li>`).join("")}</ul>
        <p class="work-stack">${list(p.tags)}</p>
        <p class="work-links">${links.join("")}</p>
      </article>`;
  }).join("");

  const yt = PROFILE.youtube;
  const ytChannelUrl = "https://www.youtube.com/channel/" + yt.channelId;
  $("music-title").textContent = yt.heading;
  $("music-blurb").textContent = yt.blurb;
  $("music-meta").innerHTML =
    def("Channel", ext(ytChannelUrl, "@" + yt.handle)) +
    def("Playing", yt.featuredTitle || "Solo piano") +
    def("Plays", list(yt.tags));
  $("tube-note-link").href = ytChannelUrl;
  $("yt-btn").href = ytChannelUrl;

  // Open on the featured video. "videoseries" (no featured video) opens on the
  // newest upload and always needs the playlist; otherwise the playlist is only
  // queued behind it when queueChannel is on -- see the note in the config block.
  // nocookie host = nothing tracked until a visitor presses play.
  const tube = $("tube");
  const vid  = yt.featuredVideo || "videoseries";
  const qs   = ["rel=0"];
  if (!yt.featuredVideo || yt.queueChannel) qs.push("list=" + yt.uploadsPlaylist);
  tube.src   = "https://www.youtube-nocookie.com/embed/" + vid + "?" + qs.join("&");
  tube.title = yt.handle + " on YouTube";

  const cm = $("contact-mail");
  cm.textContent = PROFILE.email;
  cm.href = "mailto:" + PROFILE.email;
  $("c-github").href   = PROFILE.github;
  $("c-linkedin").href = PROFILE.linkedin;
  $("foot-name").textContent = "© " + PROFILE.name;
  $("foot-year").textContent = new Date().getFullYear();

  /* ============================================================
     WhatsApp password gate — decrypts the wa.me link client-side.
     The number is AES-GCM encrypted; without the password it
     cannot be recovered from the page source.
  ============================================================ */
  (function () {
    let current = null;
    const el = (id) => document.getElementById(id);
    const b64ToBytes = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

    async function decryptWa(pass, payload) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(payload.salt), iterations: 150000, hash: "SHA-256" },
        baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const pt = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(payload.iv) }, key, b64ToBytes(payload.ct));
      return new TextDecoder().decode(pt);
    }

    function openModal(payload) {
      current = payload;
      const modal = el("wa-modal"), input = el("wa-input"), err = el("wa-err");
      if (!modal) return;
      err.textContent = "";
      input.value = "";
      modal.classList.add("open");
      setTimeout(() => input.focus(), 30);
    }
    function closeModal() {
      current = null;
      const modal = el("wa-modal");
      if (modal) modal.classList.remove("open");
    }

    async function submit() {
      if (!current) return;
      const input = el("wa-input"), err = el("wa-err");
      const pass = input.value;
      if (!pass) { err.textContent = "Enter the password."; return; }
      if (!(window.crypto && crypto.subtle)) {
        err.textContent = "Needs a secure (https) page.";
        return;
      }
      err.textContent = "Checking…";
      try {
        const url = await decryptWa(pass, current);
        closeModal();
        window.open(url, "_blank", "noopener");
      } catch (e) {
        err.textContent = "Wrong password.";
      }
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".wa-locked");
      if (btn) {
        openModal({ salt: btn.dataset.salt, iv: btn.dataset.iv, ct: btn.dataset.ct });
        return;
      }
      if (e.target.closest("#wa-submit")) { submit(); return; }
      if (e.target.closest("#wa-cancel")) { closeModal(); return; }
      if (e.target.id === "wa-modal")     { closeModal(); }
    });
    document.addEventListener("keydown", (e) => {
      const modal = el("wa-modal");
      if (e.key === "Enter" && modal && modal.classList.contains("open")) submit();
      if (e.key === "Escape" && modal && modal.classList.contains("open")) closeModal();
    });
  })();
</script>
</body>
</html>
